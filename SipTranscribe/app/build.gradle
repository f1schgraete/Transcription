plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'com.siptranscribe.app'
    compileSdk = 34

    defaultConfig {
        applicationId = "com.siptranscribe.app"
        minSdk = 26
        targetSdk = 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Locally-built linphone-sdk with our split-recording patch in mediastreamer2 + liblinphone.
    // Build steps: see CLAUDE.md "Building the local linphone-sdk AAR".
    implementation files('libs/linphone-sdk-android.aar')
    // Transitive deps the linphone-sdk Maven artefact would have pulled — files() does not.
    implementation 'org.apache.commons:commons-compress:1.16.1'
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    // Encrypts per-call transcript/summary archives at rest. Alpha is the
    // newest available coordinate; APIs we use (MasterKey, EncryptedFile)
    // are stable across 1.1.0-alpha0[3-7].
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Azure Cognitive Services Speech SDK — streams PCM to Azure via PushAudioInputStream.
    implementation 'com.microsoft.cognitiveservices.speech:client-sdk:1.37.0'

    // Google Cloud Speech-to-Text streaming gRPC client. We exclude the
    // netty-shaded transport that the library defaults to (it uses BoringSSL
    // native libs that don't ship for all Android ABIs) and bring in
    // grpc-okhttp instead, which is the supported Android transport.
    implementation('com.google.cloud:google-cloud-speech:4.34.0') {
        exclude group: 'io.grpc', module: 'grpc-netty-shaded'
        exclude group: 'io.grpc', module: 'grpc-netty'
    }
    implementation 'io.grpc:grpc-okhttp:1.62.2'

    // Square OkHttp — its WebSocket client drives the Mistral Voxtral
    // realtime STT engine. (io.grpc:grpc-okhttp above is an unrelated gRPC
    // transport and does not expose a WebSocket API.)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// google-cloud-speech ships a couple of `META-INF/*.properties` and
// duplicate licence files that conflict across its transitive deps when
// merged into an APK. The exclude list below keeps the build happy
// without dropping anything we actually need at runtime.
android {
    packagingOptions {
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE*",
                "META-INF/NOTICE*",
                "META-INF/INDEX.LIST",
                "META-INF/io.netty.versions.properties",
                "META-INF/native-image/**",
                "META-INF/services/io.grpc.ManagedChannelProvider",
                "META-INF/services/io.grpc.NameResolverProvider",
                "META-INF/services/io.grpc.ServerProvider",
                "META-INF/services/io.grpc.LoadBalancerProvider"
            ]
            pickFirsts += [
                "META-INF/services/io.grpc.ManagedChannelProvider",
                "META-INF/services/io.grpc.NameResolverProvider"
            ]
        }
    }
}
